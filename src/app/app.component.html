<h1 class="bg-warning p-3 text-center">2st Todo Crud</h1>
<div class="container mt-5">
  <div class="row">
    <div class="col-md-4 mb-3 mb-md-0">
      <div class="card">
        <div class="card-body">
          <h1>{{isInEditMode ? 'Update Todo' : 'Add Todo'}}</h1>
          <hr>
          <div class="form-group">
            <label for="todoName">Enter Todo</label>
            <input type="text" class="form-control" #todoNameRef> <br>
            <select class="form-control" #todoValueRef>
              <option value="yes">Yes</option>
              <option value="no">No</option>
            </select>
            <button
              (click)="onTodoAdd()"
             mat-raised-button color="primary"  class="mt-2 btn-block" *ngIf="!isInEditMode">Add Todo</button>
            <button 
            (click)="onTodoUpdate()"
            mat-raised-button color="primary"  class="mt-2 btn-block" *ngIf="isInEditMode">Update Todo</button>
          </div>
        </div>
      </div>
    </div>
    <div class="col-md-8">
      <div class="card">
        <div class="card-body">
          <ul class="list-group" *ngIf="todosArr.length > 0 ; else noTodos">
            <li class="list-group-item d-flex justify-content-between" *ngFor="let todo of todosArr">
              <div>
                <input
                  (click)="onChangeCheck(todo)"
                 type="checkbox" [checked]="todo.isCompleted" #isCompletedRef>
                <strong> {{todo.todoName}}</strong> &nbsp;&nbsp;
                <b class="badge" [ngClass]="{
                  'badge-success' : todo.isCompleted,
                  'badge-danger' : !todo.isCompleted
                }">{{todo.isCompleted ? 'Completed' : 'In-Completed'}}</b>
              </div>
              <div>
                <button
                (click)="onTodoEdit(todo)"
                 mat-mini-fab color="primary" class="mr-3">
                  <mat-icon>edit</mat-icon>
                </button>
                <button
                (click)="onTodoRemove(todo.todoId)"
                 mat-mini-fab color="warn">
                  <mat-icon>delete</mat-icon>
                </button>
              </div>
            </li>
          </ul>
          <ng-template #noTodos>
            <p class="alert alert-warning">
              No todo Added yet!!!
            </p>
          </ng-template>
        </div>
      </div>
    </div>
  </div>
</div>
